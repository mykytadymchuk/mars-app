<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="src/mars-reklama.com.ua-favicon.ico"
      type="image/png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/general-style.css" />
    <link rel="stylesheet" href="styles/flex-grid-page-style.css" />
    <link rel="stylesheet" href="styles/search-bar-style.css" />
    <link rel="stylesheet" href="styles/page-header-style.css" />
    <link rel="stylesheet" href="styles/suppliers-style.css" />
    <title>Постачальники</title>
  </head>
  <body>
    <div class="main-header">
      <img
        src="src/logo.jpg"
        alt="mars-logo"
        id="header-logo"
        draggable="false"
      />
      <div class="search-bar-container">
        <select
          name="supplier-search-select"
          id="supplier-search-select"
          class="search-select"
        >
          <option value="supplier-name">Постачальник</option>
          <option value="supplier-phone-number">Номер телефону</option>
        </select>
        <input
          type="text"
          name="supplier-search"
          id="supplier-search"
          class="search-bar"
          placeholder="Пошук"
        />
        <button class="search-button">
          <img src="src/search.png" alt="search-button" draggable="false" />
        </button>
      </div>

      <div class="add-new-item" id="add-new-supplier">+</div>

      <div class="header-right-corner">
        <p id="main-greetings">Вітаю, username!</p>
      </div>
    </div>
    <div class="main-body">
      <div class="flex-element">
        <img
          src="src/plastics.svg"
          alt="plastics"
          class="supplier-photo"
          draggable="false"
        />
        <div class="flex-element-main-info-container">
          <p class="flex-element-name">Plastics</p>
        </div>
        <div class="flex-element-info-container">
          <hr />
          <p><span class="row-title">Номер телефону:</span> +380ХХ ХХХ ХХ ХХ</p>
          <hr />
        </div>
        <div class="flex-element-edit-container">
          <p class="flex-element-edit">Редагувати</p>
        </div>
      </div>
      <div class="flex-element">
        <img
          src="src/ARB.png"
          alt="arb"
          class="supplier-photo"
          draggable="false"
        />
        <div class="flex-element-main-info-container">
          <p class="flex-element-name">ARB</p>
        </div>
        <div class="flex-element-info-container">
          <hr />
          <p><span class="row-title">Номер телефону:</span> +380ХХ ХХХ ХХ ХХ</p>
          <hr />
        </div>
        <div class="flex-element-edit-container">
          <p class="flex-element-edit">Редагувати</p>
        </div>
      </div>
      <div class="flex-element">
        <img
          src="src/Orly.png"
          alt="orly"
          class="supplier-photo"
          draggable="false"
        />
        <div class="flex-element-main-info-container">
          <p class="flex-element-name">Orly</p>
        </div>
        <div class="flex-element-info-container">
          <hr />
          <p><span class="row-title">Номер телефону:</span> +380ХХ ХХХ ХХ ХХ</p>
          <hr />
        </div>
        <div class="flex-element-edit-container">
          <p class="flex-element-edit">Редагувати</p>
        </div>
      </div>
      <div class="flex-element">
        <img
          src="src/prostir.webp"
          alt="prostir"
          class="supplier-photo"
          draggable="false"
        />
        <div class="flex-element-main-info-container">
          <p class="flex-element-name">Prostir</p>
        </div>
        <div class="flex-element-info-container">
          <hr />
          <p><span class="row-title">Номер телефону:</span> +380ХХ ХХХ ХХ ХХ</p>
          <hr />
        </div>
        <div class="flex-element-edit-container">
          <p class="flex-element-edit">Редагувати</p>
        </div>
      </div>
    </div>

    <script>
      const marsLogo = document.getElementById("header-logo");

      marsLogo.addEventListener("click", () => {
        window.location.href = "http://mars-app/main.html";
      });
    </script>
  </body>
</html>
