<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="src/mars-reklama.com.ua-favicon.ico"
      type="image/png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/edit-account-style.css" />
    <link rel="stylesheet" href="styles/general-style.css" />
    <title>Редагування акаунту</title>
  </head>
  <body>
    <div class="main-header">
      <img
        src="src/logo.jpg"
        alt="mars-logo"
        id="header-logo"
        draggable="false"
      />
      <div class="header-right-corner">
        <p id="main-greetings">Вітаю, username!</p>
      </div>
    </div>
    <div class="main-body">
      <div class="edit-account-container">
        <p class="page-title">РЕДАГУВАННЯ АКАУНТУ</p>
        <form action="editAccountProcess.php" method="post">
          <div class="edit-account-row">
            <label class="edit-account-element" for="username">Логін</label>
            <input type="text" name="username" class="text-input" required />
          </div>
          <div class="edit-account-row">
            <label class="edit-account-element" for="password">Пароль</label>
            <input type="text" name="password" class="text-input" required />
          </div>
          <div class="edit-account-buttons">
            <input type="submit" value="Зберегти" class="submit-button" />
            <button id="cancel-button">Скасувати</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const cancelButton = document.getElementById("cancel-button");
      const marsLogo = document.getElementById("header-logo");

      marsLogo.addEventListener("click", () => {
        window.location.href = "http://mars-app/main.html";
      });

      cancelButton.addEventListener("click", () => {
        window.location.href = "http://mars-app/main.html";
      });
    </script>
  </body>
</html>
